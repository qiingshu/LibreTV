name: libretv-security-candidate-20261110
services:
  web:
    image: libretv-security:2210-20261110
    build:
      context: ./candidate-source
    restart: "no"
    ports:
      - "127.0.0.1:18081:8080"
    env_file: ./candidate.env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
